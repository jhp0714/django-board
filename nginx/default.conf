upstream board_backend {
    server web:8000;
}

server {
    listen 80;
    server_name django-board.kro.kr www.django-board.kro.kr;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name django-board.kro.kr www.django-board.kro.kr;

    ssl_certificate /etc/letsencrypt/live/django-board.kro.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/django-board.kro.kr/privkey.pem;

    client_max_body_size 10M;

    location /static/ {
        alias /app/staticfiles/;
    }

    location / {
        proxy_pass http://board_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}